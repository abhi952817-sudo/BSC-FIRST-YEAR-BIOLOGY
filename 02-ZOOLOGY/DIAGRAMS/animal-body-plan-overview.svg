<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="100%" height="100%" fill="#fbfbff"/><text x="500" y="48" text-anchor="middle" font-size="30" font-family="Arial" font-weight="bold" fill="#25324a">Animal Body Plan · जंतु शरीर संगठन</text><g font-family="Arial" fill="#25324a"><text x="250" y="110" text-anchor="middle" font-size="23" font-weight="bold">Symmetry</text><circle cx="250" cy="260" r="105" fill="#e8f4ff" stroke="#4b83b8" stroke-width="3"/><path d="M250 155 L250 365 M145 260 L355 260 M176 186 L324 334 M324 186 L176 334" stroke="#4b83b8" stroke-width="3"/><text x="250" y="405" text-anchor="middle" font-size="18">Radial: many planes</text><rect x="90" y="445" width="320" height="55" rx="12" fill="#eaf7ed" stroke="#57966a" stroke-width="2"/><path d="M250 445 L250 500" stroke="#57966a" stroke-width="2"/><text x="250" y="480" text-anchor="middle" font-size="18">Bilateral: one main plane</text><text x="730" y="110" text-anchor="middle" font-size="23" font-weight="bold">Three germ layers</text><rect x="570" y="160" width="320" height="230" rx="20" fill="#f4edff" stroke="#8968b3" stroke-width="3"/><rect x="595" y="185" width="270" height="180" rx="14" fill="#ffe4e8" stroke="#ba6875" stroke-width="2"/><rect x="620" y="210" width="220" height="130" rx="10" fill="#fff1cf" stroke="#bd8b3e" stroke-width="2"/><text x="730" y="150" text-anchor="middle" font-size="17">Outside → inside</text><text x="730" y="250" text-anchor="middle" font-size="20" font-weight="bold">Ectoderm</text><text x="730" y="300" text-anchor="middle" font-size="20" font-weight="bold">Mesoderm</text><text x="730" y="345" text-anchor="middle" font-size="20" font-weight="bold">Endoderm</text><text x="730" y="430" text-anchor="middle" font-size="18">Triploblastic body plan (schematic)</text><text x="500" y="525" text-anchor="middle" font-size="16" fill="#526579">Concept diagram only; body shapes and layer proportions are not to scale.</text></g></svg>