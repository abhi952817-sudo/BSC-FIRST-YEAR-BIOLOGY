<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="100%" height="100%" fill="#f8fbff"/><text x="500" y="48" text-anchor="middle" font-size="30" font-family="Arial" font-weight="bold" fill="#17324d">Plant Diversity · पादप विविधता</text><text x="500" y="85" text-anchor="middle" font-size="17" font-family="Arial" fill="#526579">Introductory comparison · schematic, not an evolutionary tree</text><g font-family="Arial" text-anchor="middle"><g><rect x="35" y="150" width="170" height="235" rx="18" fill="#e8f4ff" stroke="#4b83b8" stroke-width="3"/><text x="120" y="195" font-size="24" font-weight="bold" fill="#17324d">Algae</text><text x="120" y="245" font-size="18" fill="#17324d">Simple thallus</text><text x="120" y="278" font-size="18" fill="#17324d">Mostly aquatic</text><text x="120" y="330" font-size="17" fill="#17324d">Spirogyra</text></g><g><rect x="230" y="150" width="170" height="235" rx="18" fill="#eaf7ed" stroke="#57966a" stroke-width="3"/><text x="315" y="195" font-size="24" font-weight="bold" fill="#17324d">Bryophytes</text><text x="315" y="245" font-size="18" fill="#17324d">No vascular tissue</text><text x="315" y="278" font-size="18" fill="#17324d">Spores</text><text x="315" y="330" font-size="17" fill="#17324d">Funaria</text></g><g><rect x="425" y="150" width="170" height="235" rx="18" fill="#fff4df" stroke="#bd8b3e" stroke-width="3"/><text x="510" y="195" font-size="24" font-weight="bold" fill="#17324d">Pteridophytes</text><text x="510" y="245" font-size="18" fill="#17324d">Vascular tissue</text><text x="510" y="278" font-size="18" fill="#17324d">No seeds</text><text x="510" y="330" font-size="17" fill="#17324d">Pteris</text></g><g><rect x="620" y="150" width="170" height="235" rx="18" fill="#f4edff" stroke="#8968b3" stroke-width="3"/><text x="705" y="195" font-size="24" font-weight="bold" fill="#17324d">Gymnosperms</text><text x="705" y="245" font-size="18" fill="#17324d">Naked seeds</text><text x="705" y="278" font-size="18" fill="#17324d">No true fruits</text><text x="705" y="330" font-size="17" fill="#17324d">Pinus</text></g><g><rect x="815" y="150" width="150" height="235" rx="18" fill="#ffeef0" stroke="#ba6875" stroke-width="3"/><text x="890" y="195" font-size="24" font-weight="bold" fill="#17324d">Angiosperms</text><text x="890" y="245" font-size="18" fill="#17324d">Flowers</text><text x="890" y="278" font-size="18" fill="#17324d">Seeds in fruit</text><text x="890" y="330" font-size="17" fill="#17324d">Mango</text></g></g><text x="500" y="455" text-anchor="middle" font-size="22" font-family="Arial" font-weight="bold" fill="#17324d">Study cue: Algae → Bryophytes → Pteridophytes → Gymnosperms → Angiosperms</text><text x="500" y="500" text-anchor="middle" font-size="17" font-family="Arial" fill="#526579">Compare vascular tissue, spores/seeds, and flowers/fruits.</text></svg>